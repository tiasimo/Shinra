name: Build Shinra

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Compila Shinra APK (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Etichetta Android
        run: sed -i 's/android:label="[^"]*"/android:label="Shinra"/' android/app/src/main/AndroidManifest.xml

      - name: Crea file .env
        run: touch .env

      - run: flutter pub get

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: Shinra-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
