name: Build Shinra

on:
  workflow_dispatch: # Ti permette di avviare la creazione dell'app con un bottone

permissions:
  contents: write

jobs:
  build-android:
    name: Compila Shinra APK (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice di Shinra
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configura Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Installa dipendenze
        run: flutter pub get

      - name: Personalizzazione Totale Shinra (Punto 2 - Nome, ID e UI)
        run: |
          # 1. Cambia il nome sotto l'icona Android in Shinra
          sed -i 's/android:label="AnymeX"/android:label="Shinra"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="anymex"/android:label="Shinra"/g' android/app/src/main/AndroidManifest.xml
          
          # 2. Cambia tutte le scritte "AnymeX" dentro le schermate dell'app in "Shinra"
          find lib/ -type f -name "*.dart" -exec sed -i 's/AnymeX/Shinra/g' {} +
          
          # 3. Usa la firma universale per generare l'APK senza chiavi segrete
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true
          sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debug")/g' android/app/build.gradle.kts || true


      - name: Compila i file APK
        run: flutter build apk --release --split-per-abi

      - name: Salva gli APK pronti per il download
        uses: actions/upload-artifact@v4
        with:
          name: Shinra-Android-APK
          path: build/app/outputs/flutter-apk/*.apk
