name: Build Shinra

on:
  workflow_dispatch: # Ti permette di avviare la creazione dell'app con un bottone

permissions:
  contents: write

jobs:
  build-android:
    name: Compila Shinra APK (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice di Shinra
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configura Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Installa dipendenze
        run: flutter pub get

      - name: Personalizzazione Shinra + Traduzione Italiana (Punti 2 e 4)
        run: |
          # 1. Nome sotto l'icona Android e Package ID indipendente
          sed -i 's/android:label="AnymeX"/android:label="Shinra"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="anymex"/android:label="Shinra"/g' android/app/src/main/AndroidManifest.xml
          
          # 2. Sostituisce ogni scritta visibile "AnymeX" con "Shinra" in tutta l'app
          find lib/ -type f -name "*.dart" -exec sed -i 's/AnymeX/Shinra/g' {} +
          
          # 3. Traduzione Interfaccia Principale in Italiano
          find lib/screens/ lib/widgets/ -type f -name "*.dart" -exec sed -i \
            -e "s/'Continue Watching'/'Continua a guardare'/g" \
            -e 's/"Continue Watching"/"Continua a guardare"/g' \
            -e "s/'Continue Reading'/'Continua a leggere'/g" \
            -e 's/"Continue Reading"/"Continua a leggere"/g' \
            -e "s/'Currently Watching'/'In visione'/g" \
            -e "s/'Currently Reading'/'In lettura'/g" \
            -e "s/'Trending Anime'/'Anime in tendenza'/g" \
            -e "s/'Trending Manga'/'Manga in tendenza'/g" \
            -e "s/'Popular Anime'/'Anime popolari'/g" \
            -e "s/'Popular Manga'/'Manga popolari'/g" \
            -e "s/'Top Rated'/'Più votati'/g" \
            -e "s/'Recently Updated'/'Aggiornati di recente'/g" \
            -e "s/'Search...'/'Cerca...'/g" \
            -e "s/'Settings'/'Impostazioni'/g" \
            -e "s/'Extensions'/'Estensioni'/g" \
            -e "s/'Installed'/'Installate'/g" \
            -e "s/'Available'/'Disponibili'/g" \
            -e "s/'Chapters'/'Capitoli'/g" \
            -e "s/'Episodes'/'Episodi'/g" \
            -e "s/'Characters'/'Personaggi'/g" \
            -e "s/'Recommendations'/'Consigliati'/g" \
            {} +

          # 4. Firma universale per compilazione senza chiavi segrete
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true
          sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debug")/g' android/app/build.gradle.kts || true


      - name: Compila i file APK
        run: flutter build apk --release --split-per-abi

      - name: Salva gli APK pronti per il download
        uses: actions/upload-artifact@v4
        with:
          name: Shinra-Android-APK
          path: build/app/outputs/flutter-apk/*.apk
