name: Build Shinra

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compila Shinra APK (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configura Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Modifica Nome app e Firma
        run: |
          sed -i 's/android:label="AnymeX"/android:label="Shinra"/g' android/app/src/main/AndroidManifest.xml || true
          sed -i 's/android:label="anymex"/android:label="Shinra"/g' android/app/src/main/AndroidManifest.xml || true
          find lib/ -type f -name "*.dart" -exec sed -i 's/AnymeX/Shinra/g' {} + || true
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true

      - name: Scarica dipendenze Flutter
        run: flutter pub get

      - name: Compila APK Release
        run: flutter build apk --release --split-per-abi

      - name: Carica APK come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shinra-Android-APK
          path: build/app/outputs/flutter-apk/*.apk
