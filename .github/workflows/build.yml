name: Build Shinra

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compila Shinra APK (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice di Shinra
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configura Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x' # Versione stabile e compatibile
          channel: 'stable'
          cache: true

      - name: Accetta licenze Android SDK
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Personalizzazione Nome e ID Shinra
        run: |
          # Cambia il nome visualizzato sotto l'icona
          sed -i 's/android:label="AnymeX"/android:label="Shinra"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="anymex"/android:label="Shinra"/g' android/app/src/main/AndroidManifest.xml
          
          # Sostituzione sicura delle etichette principali senza toccare il codice logico
          find lib/ -type f -name "*.dart" -exec sed -i 's/AnymeX/Shinra/g' {} +

          # Firma di debug universale per evitare errori di keystore mancanti
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true
          sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debug")/g' android/app/build.gradle.kts || true

      - name: Pulisci e scarica dipendenze
        run: flutter clean && flutter pub get

      - name: Compila i file APK Release
        run: flutter build apk --release --split-per-abi

      - name: Salva gli APK pronti per il download
        uses: actions/upload-artifact@v4
        with:
          name: Shinra-Android-APK
          path: build/app/outputs/flutter-apk/*.apk
